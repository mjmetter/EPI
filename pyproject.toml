[project]
name = "engineering-productivity-index"
version = "0.1.0"
description = "Engineering Productivity Index — data collection, scoring, and reporting"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.scripts]
collect-git-metrics          = "epi.collectors.git_metrics:main"
collect-repo-health          = "epi.collectors.repo_health:main"
score-epi                    = "epi.scoring:main"
generate-productivity-report = "epi.reports.productivity:main"
import-incidents-csv         = "epi.importers.incidents:main"
import-uptime                = "epi.importers.uptime:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["epi*"]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.14",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modern Python patterns)
    "B",    # flake8-bugbear (common bugs)
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",    # line length handled by formatter
    "RUF001",  # ambiguous Unicode chars (en dashes in descriptions are intentional)
    "SIM108",  # ternary operator — if/else blocks are often clearer for f-strings
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "reports/*"]

[tool.coverage.report]
show_missing = true
fail_under = 0
